# Builds Scandium-<version>.ipa and publishes it as a GitHub release when a
# version tag (e.g. 2.2.8) is pushed:
#
#   git tag 2.2.8 && git push origin 2.2.8
#
# The tag must match CFBundleShortVersionString in Info.plist. The release
# notes list the titles of the commits since the previous version tag. If a
# release for the tag already exists (e.g. created by hand), the IPA is
# uploaded to it, and the notes are only filled in if it has none.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          xcodebuild -version
          ./scripts/build_ipa_macos.sh
          mv Scandium.ipa "Scandium-$VERSION.ipa"

      - name: Write release notes
        run: |
          # Previous version tag (skips non-version tags such as "Beta")
          PREV="$(git describe --tags --abbrev=0 \
            --match '[0-9]*.[0-9]*.[0-9]*' --match 'v[0-9]*.[0-9]*.[0-9]*' \
            "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --no-merges --format='- %s' "$PREV..$GITHUB_REF_NAME" > release-notes.md
          else
            : > release-notes.md
          fi
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="Scandium-$VERSION.ipa"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber
            # Keep notes written by hand; only fill in empty ones
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body | tr -d '[:space:]')" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$IPA" \
              --title "Scandium $VERSION" \
              --verify-tag \
              --notes-file release-notes.md
          fi
