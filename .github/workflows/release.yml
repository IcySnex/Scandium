# Builds Scandium-<version>.ipa and publishes it as a GitHub release when a
# version tag (e.g. 2.2.8) is pushed:
#
#   git tag 2.2.8 && git push origin 2.2.8
#
# The tag must match CFBundleShortVersionString in Info.plist. If a release
# for the tag already exists (e.g. created by hand with notes), the IPA is
# uploaded to it instead.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          xcodebuild -version
          ./scripts/build_ipa_macos.sh
          mv Scandium.ipa "Scandium-$VERSION.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="Scandium-$VERSION.ipa"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber
          else
            # An annotated tag's message becomes the release notes
            if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
              NOTES=(--notes-from-tag)
            else
              NOTES=(--notes "")
            fi
            gh release create "$GITHUB_REF_NAME" "$IPA" \
              --title "Scandium $VERSION" \
              --verify-tag \
              "${NOTES[@]}"
          fi
